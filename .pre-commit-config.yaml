default_install_hook_types: ["pre-push", "pre-commit"]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-ast
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
  - repo: local
    hooks:
      - id: lint
        name: golangci
        entry: golangci-lint run --fix ./...
        language: system
        pass_filenames: false
        types: [go]
      - id: formatting
        name: format with gofumpt
        language: system
        types: [go]
        entry: gofumpt -l -w
        pass_filenames: true
      - id: docs-sync
        name: docs-sync check
        entry: go run ./hack/docsync --check
        language: system
        pass_filenames: false
        types: [go]
      - id: testing
        name: go test
        language: system
        types: [go]
        # Hooks in a linked worktree export an absolute GIT_DIR; drop it so
        # git commands in tests cannot reach this repository.
        entry: sh -c 'unset $(git rev-parse --local-env-vars); exec go test ./...'
        pass_filenames: false
